[package]
name = "swe_vminit_shell"
version = "0.1.0"
edition = "2021"
description = "vminit shell — built-in userspace utilities and interactive REPL for microVM guests"

[lib]
name = "swe_vminit_shell"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["dep:dirs"]

[dependencies]
dirs = { version = "5", optional = true }

[[test]]
name = "shell_int_test"
path = "tests/shell_int_test.rs"

[[test]]
name = "shell_security_test"
path = "tests/shell_security_test.rs"

[[test]]
name = "io_int_test"
path = "tests/io_int_test.rs"

[[test]]
name = "io_security_test"
path = "tests/io_security_test.rs"

[[test]]
name = "builtins_int_test"
path = "tests/builtins_int_test.rs"

[[test]]
name = "builtins_security_test"
path = "tests/builtins_security_test.rs"

[[test]]
name = "traits_int_test"
path = "tests/traits_int_test.rs"

[[test]]
name = "traits_security_test"
path = "tests/traits_security_test.rs"

[[test]]
name = "repl_int_test"
path = "tests/repl_int_test.rs"

[[test]]
name = "repl_security_test"
path = "tests/repl_security_test.rs"

[[test]]
name = "output_int_test"
path = "tests/output_int_test.rs"

[[test]]
name = "input_int_test"
path = "tests/input_int_test.rs"
