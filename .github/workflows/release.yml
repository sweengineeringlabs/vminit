name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish vmfs ELF
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout justpkg sibling (required for optional packages feature)
        env:
          CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          if [ -z "${CI_GIT_TOKEN:-}" ]; then
            echo "::error::CI_GIT_TOKEN unset; justpkg clone will fail." >&2
            exit 1
          fi
          SIBLING_ROOT="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          git clone --depth 1 --branch dev \
            "https://x-access-token:${CI_GIT_TOKEN}@github.com/sweengineeringlabs/justpkg.git" \
            "$SIBLING_ROOT/justpkg"
          test -f "$SIBLING_ROOT/justpkg/Cargo.toml" \
            || { echo "::error::justpkg clone incomplete" >&2; exit 1; }

      - name: Install musl tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Install Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build vminit binary
        # Use --manifest-path to build only the bin crate, bypassing workspace
        # members that have optional sibling path-deps (main/features/pkg →
        # justpkg).  The packages feature is not needed for the published vmfs
        # binary; it can be enabled by callers who supply the sibling.
        run: |
          cargo build --release \
            --manifest-path main/features/bin/Cargo.toml \
            --target x86_64-unknown-linux-musl

      - name: Verify binary
        run: |
          BINARY="main/features/bin/target/x86_64-unknown-linux-musl/release/vmfs"
          test -f "$BINARY" || { echo "error: binary not found at $BINARY"; exit 1; }
          file "$BINARY"
          ls -lh "$BINARY"

      - name: Stage release asset
        run: |
          cp main/features/bin/target/x86_64-unknown-linux-musl/release/vmfs vmfs

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: vmfs
          generate_release_notes: true
